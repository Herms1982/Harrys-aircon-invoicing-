name: Build & Sign Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Configure Android Permissions
        run: |
          cat << 'EOF' > update-permissions.js
          const fs = require('fs');
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          if (fs.existsSync(manifestPath)) {
            let manifest = fs.readFileSync(manifestPath, 'utf8');
            const perms = [
              'android.permission.INTERNET',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_MEDIA_AUDIO',
              'android.permission.ACCESS_MEDIA_LOCATION'
            ];
            perms.forEach(p => {
              if (!manifest.includes(p)) {
                manifest = manifest.replace('</manifest>', `    <uses-permission android:name="${p}" />\n</manifest>`);
              }
            });
            fs.writeFileSync(manifestPath, manifest, 'utf8');
            console.log('Updated AndroidManifest.xml permissions successfully');
          }
          EOF
          node update-permissions.js

      - name: Generate Release Signing Keystore Certificate
        run: |
          KEYSTORE_PATH="android/app/harrys-release.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias harrys-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "HarrysAircon2026Pass" \
            -keypass "HarrysAircon2026Pass" \
            -dname "CN=Harrys Aircon, OU=App, O=Harrys Aircon Electrical Solar, L=Pretoria, ST=Gauteng, C=ZA"

      - name: Configure Signing in build.gradle
        run: |
          cat << 'EOF' > configure-gradle.js
          const fs = require('fs');
          const gradlePath = 'android/app/build.gradle';
          if (fs.existsSync(gradlePath)) {
            let gradle = fs.readFileSync(gradlePath, 'utf8');
            const signingBlock = `
        signingConfigs {
            release {
                storeFile file("harrys-release.keystore")
                storePassword "HarrysAircon2026Pass"
                keyAlias "harrys-key"
                keyPassword "HarrysAircon2026Pass"
            }
        }`;
            if (!gradle.includes('signingConfigs {')) {
              gradle = gradle.replace(/buildTypes\s*\{/, signingBlock + '\n    buildTypes {');
            }
            if (!gradle.includes('signingConfig signingConfigs.release')) {
              gradle = gradle.replace(/release\s*\{/, 'release {\n            signingConfig signingConfigs.release');
            }
            fs.writeFileSync(gradlePath, gradle, 'utf8');
            console.log('Configured build.gradle signing configs successfully');
          }
          EOF
          node configure-gradle.js

      - name: Build Android Release & Debug APKs with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew assembleRelease --stacktrace || true

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Harrys-Aircon-Signed-Release.apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harrys-Aircon-Debug.apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0 Release' }}
          body: |
            Automated Android Release APK build for Harry's Aircon, Electrical & Solar App.
            
            - Built automatically from commit: `${{ github.sha }}`
            - Direct Release APK attached below.
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
