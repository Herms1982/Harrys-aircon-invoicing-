name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build PWA Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web App
        run: |
          npm ci || npm install
          npm run build

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor & Generate Android Project
        run: |
          # Install Capacitor CLI
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Initialize Capacitor with App Name and ID
          npx cap init "MyApp" "com.example.myapp" --web-dir dist

          # Add Android platform and copy web build
          npx cap add android
          npx cap copy android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-android-apk
          path: "android/app/build/outputs/apk/debug/*.apk"
