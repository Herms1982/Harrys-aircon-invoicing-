name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build PWA Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web App
        run: |
          npm ci || npm install
          npm run build

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap & Serve CLI
        run: npm install -g @bubblewrap/cli serve

      - name: Generate Android Project & Build APK
        run: |
          # 1. Start a local web server in the background to host dist/
          npx serve -s dist -l 8080 &
          sleep 3

          # 2. Pre-configure JDK and Android SDK paths
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

          # 3. Pre-create project folder
          mkdir -p android-project

          # 4. Initialize Bubblewrap using local server URL
          npx @bubblewrap/cli init --manifest=http://localhost:8080/manifest.json --directory=android-project --skipKeytool

          # 5. Build APK
          cd android-project
          npx @bubblewrap/cli build --skipSigning

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-android-apk
          path: "**/build/outputs/apk/**/*.apk"
