name: Build & Sign Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Generate Trusted Release Signing Keystore Certificate
        run: |
          mkdir -p android/app
          KEYSTORE_PATH="android/app/harrys-release.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias harrys-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "HarrysAircon2026Pass" \
              -keypass "HarrysAircon2026Pass" \
              -dname "CN=Harrys Aircon, OU=App, O=Harrys Aircon Electrical Solar, L=Pretoria, ST=Gauteng, C=ZA"
          else
            echo "Keystore $KEYSTORE_PATH already exists, skipping keytool generation."
          fi

      - name: Configure Android Permissions and Release Signing in Gradle
        run: node scripts/configure-android.js

      - name: Build Android Release APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Build Android Debug APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harrys-Aircon-Signed-Release.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harrys-Aircon-Debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0 Release' }}
          body: |
            Automated Android Release APK build for Harry's Aircon, Electrical & Solar App.
            
            - Built automatically from commit: `${{ github.sha }}`
            - Direct Signed Release APK and Debug APK attached below.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
