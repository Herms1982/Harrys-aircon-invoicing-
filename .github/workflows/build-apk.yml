name: Build Signed Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js Environment (Node 22)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install Dependencies (Includes react-is fix for recharts)
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install react-is --save

      # 4. Check Git Case Sensitivity
      - name: Check Git File Casing
        run: |
          git config core.ignorecase false
          git status

      # 5. Configure Android Environment Pre-Build
      - name: Configure Android Pre-Build
        run: node scripts/configure-android.js

      # 6. Build Web Assets (Vite/Rollup)
      - name: Build Web Assets
        run: npm run build

      # 7. Setup Java JDK 21
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 8. Setup Gradle Action
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 9. Setup Android SDK & Accept Licenses automatically
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      # 10. Sync Capacitor Native Android Project
      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      # 11. Generate Keystore if missing
      - name: Generate Release Keystore
        run: |
          mkdir -p android/app
          KEYSTORE_PATH="android/app/harrys-release.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias harrys-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "HarrysAircon2026Pass" \
              -keypass "HarrysAircon2026Pass" \
              -dname "CN=Harrys Aircon, OU=App, O=Harrys Aircon Electrical Solar, L=Pretoria, ST=Gauteng, C=ZA"
          else
            echo "Keystore $KEYSTORE_PATH already exists."
          fi

      # 12. Run Post-Keystore Android Configuration Script
      - name: Run Post-Keystore Configuration
        run: node scripts/configure-android.js

      # 13. Build Release APK via Gradle Wrapper
      - name: Build Android APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --info

      # 14. Upload APK Artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
